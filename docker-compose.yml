services:
  api:
    build: .
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      RABBITMQ_HOST: localhost
      RESULT_DB_PATH: /app/data/result_db.db
    network_mode: host
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build: .
    command: uv run worker.py
    env_file: .env
    environment:
      RABBITMQ_HOST: localhost
      RESULT_DB_PATH: /app/data/result_db.db
    network_mode: host
    volumes:
      - ./data:/app/data
    restart: unless-stopped
